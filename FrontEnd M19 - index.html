<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="produtos">
        <div class="produto produtos__item">
            <img class="produto__imagem" src="./Imag/bouquet-4839049_640.jpg" alt="Nome do produto">
            <h4 class="produto__nome">Buque Frutífero</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
        <div class="produto produtos__item produto--em-destaque">
            <img class="produto__imagem" src="./Imag/bridal-bouquet-2795428_640.jpg" alt="Nome do produto em destaque">
            <h4 class="produto__nome">Buque Primavera</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
        <div class="produto produtos__item">
            <img class="produto__imagem" src="./Imag/florist-bouquet-1712067_640.jpg" alt="Nome do produto">
            <h4 class="produto__nome">Buque Verão</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
    </div>
</body>
</html>
